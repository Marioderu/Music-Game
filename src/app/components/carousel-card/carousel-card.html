<div
  class="h-60 w-[10.7rem] bg-black rounded-2xl overflow-hidden border-2 border-gold drop-shadow-[0px_0px_5px_#e9b93f]"
>
  <div class="relative">
    <img class="size-[10.7rem] object-cover" [src]="img()" [alt]="artist()" />

    <div
      class="absolute inset-x-0 bottom-0 h-12 bg-linear-to-t from-black via-black/70 to-transparent"
    ></div>
  </div>

  <div class="flex items-center gap-2 mt-1 mb-3 px-4">
    <div class="h-px flex-1 bg-gold"></div>

    <span class="text-gold text-xs">✦</span>

    <div class="h-px flex-1 bg-gold"></div>
  </div>

  <p class="text-center px-2 text-foreground font-display text-xl">
    {{ artist() }}
  </p>
</div>
