<div class="rounded-2xl" [style.box-shadow]="'0 0 10px ' + tribe().glowColor">
  <div class="flex flex-row gap-4 bg-surface-2 rounded-2xl">
    <img class="object-cover max-h-24 rounded-2xl" [src]="tribe().img" [alt]="tribe().name" />

    <div class="flex flex-col justify-center gap-2">
      <p class="font-sans font-bold text-xl text-foreground">{{ tribe().name }}</p>
    </div>
  </div>
</div>
